name: CI

on:
  pull_request:

permissions:
  contents: read

# The only setting Django requires. This value isn't a real secret: the checks
# sign nothing that outlives the run.
env:
  SECRET_KEY: ci-only-value-not-used-outside-this-workflow

jobs:
  checks:
    # The tests call git and uv, including git ls-files on the checkout, so they
    # need a full working tree on a runner with both on the PATH.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.12"
      - name: Install from uv.lock
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check
      - name: Run the tests
        run: uv run pytest
